<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gobble Run: The Great Turkey Escape</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="gameCanvas" tabindex="0" aria-label="Gobble Run. Space or click to jump, Down to duck and hide in hay, Shift to dash, P to pause, M to mute."></canvas>
  <div class="toolbar"><button id="pauseButton" type="button">Pause · P</button><button id="soundButton" type="button" aria-pressed="false">Sound on · M</button></div>
  <nav id="practiceMenu" aria-label="Stage practice"><span>Practice a stage</span><button data-practice="0">Farmyard</button><button data-practice="1">Barn</button><button data-practice="2">Kitchen</button></nav>
  <script type="module" src="src/main.js"></script>
</body>
</html>
